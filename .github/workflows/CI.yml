name: CI
on: [pull_request]

jobs:
  build:
    runs-on: macOS-26

    steps:
      - uses: actions/checkout@v7

      - name: Read Xcode version
        id: xcode_version
        run: echo "XCODE_VERSION=$(cat .xcode-version)" >> $GITHUB_ENV

      - name: Setup Xcode using .xcode-version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run install

      - name: Generate Xcode project with Tuist
        run: mise run generate

      - name: Run tests
        run: mise run test || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          swift: true
          swift_project: SwiftExplorer
          verbose: true
